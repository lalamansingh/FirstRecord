# Local production-like run:  docker compose up --build   ->  http://localhost:3000
services:
  firstrecord:
    build: .
    ports:
      - "3000:3000"
    environment:
      APP_ORIGIN: http://localhost:3000
      DEMO_MODE: "true"
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      STORAGE_ENCRYPTION_KEY: ${STORAGE_ENCRYPTION_KEY:?set STORAGE_ENCRYPTION_KEY}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
      JUDGE_EMAIL: ${JUDGE_EMAIL:-}
      JUDGE_PASSWORD: ${JUDGE_PASSWORD:-}
      JUDGE_NAME: ${JUDGE_NAME:-Hackathon Judges}
    volumes:
      - firstrecord-data:/data
    restart: unless-stopped
volumes:
  firstrecord-data:
